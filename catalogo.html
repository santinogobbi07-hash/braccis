<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <!-- Reglas de seguridad metidas en la propia pagina.
       Hacen falta porque GitHub Pages no lee el archivo _headers.
       Si se publica en Netlify, manda _headers (que ademas agrega
       proteccion contra iframes y HTTPS forzado, que aca no se pueden). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none'">
  <!-- ============ IMPORTANTE ============
       Le pide a Google y a los buscadores que NO indexen este sitio.
       Esta puesto porque esta direccion es una muestra temporal: si se
       da de baja, un link indexado seguiria apareciendo en las busquedas
       durante semanas.

       CUANDO EL SITIO SEA EL DEFINITIVO, HAY QUE BORRAR ESTA LINEA
       de las tres paginas. Si no, el sitio nunca aparece en Google.
       ==================================== -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Braccis</title>
  <meta name="description" content="Catálogo completo de prendas Braccis: remeras, jeans, tejidos, camisas y blusas. Talles, colores y composición de cada modelo.">


  <!-- Lo que se ve al pegar el link en WhatsApp, Instagram o Facebook.
       IMPORTANTE: og:image y og:url tienen que llevar la direccion
       COMPLETA del sitio publicado. Con ruta relativa, WhatsApp no
       muestra la miniatura. Ver herramientas/poner_dominio.py -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Braccis">
  <meta property="og:locale" content="es_AR">
  <meta property="og:title" content="Catálogo | Braccis">
  <meta property="og:description" content="53 prendas de la colección Primavera–Verano 2027, con talles y colores.">
  <meta property="og:url" content="https://santinogobbi07-hash.github.io/braccis/catalogo.html">
  <meta property="og:image" content="https://santinogobbi07-hash.github.io/braccis/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1f1b18">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="contenedor header__inner">
      <a href="index.html" class="logo"><img src="img/logo.png" alt="Braccis"></a>

      <nav class="nav">
        <ul class="nav__lista">
          <li><a class="nav__link" href="index.html">Inicio</a></li>
          <li><a class="nav__link" href="catalogo.html" aria-current="page">Catálogo</a></li>
          <li><a class="nav__link" href="index.html#nosotros">Nosotros</a></li>
          <li><a class="nav__link" href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

      <button class="hamburguesa" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ============ ENCABEZADO DE PAGINA ============ -->
  <section style="padding-top:72px">
    <div class="contenedor">
      <p class="antetitulo">Colección completa</p>
      <h1 class="titulo-seccion">Catálogo</h1>
      <p class="bajada">Tocá cualquier prenda para ver su ficha: talles, colores y composición.</p>
    </div>
  </section>

  <!-- ============ FILTROS ============ -->
  <div class="contenedor">
    <div class="filtros">
      <!-- Los chips se generan solos con las categorias de js/productos.js -->
      <div class="filtros__grupo" data-filtros></div>

      <label class="buscador">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.7" y2="16.7"></line>
        </svg>
        <input type="search" placeholder="Buscar por nombre o código" data-buscador aria-label="Buscar prendas">
      </label>
    </div>

    <p class="contador" data-contador></p>

    <!-- ============ GRILLA ============ -->
    <div class="grilla-productos" data-grilla></div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="contenedor">
      <div class="footer__grid">
        <div>
          <p class="logo"><img src="img/logo-claro.png" alt="Braccis"></p>
          <p style="margin-top:14px;max-width:36ch;color:rgba(250,247,242,.7)" data-empresa="descripcionCorta"></p>
        </div>

        <div>
          <p class="footer__titulo">Navegación</p>
          <ul class="footer__lista">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="index.html#nosotros">Nosotros</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </div>

        <div>
          <p class="footer__titulo">Contacto</p>
          <ul class="footer__lista">
            <li><a data-empresa="email" href="#"></a></li>
            <li><a data-empresa="telefonoVisible" href="#"></a></li>
            <li><a data-empresa="instagramUsuario" href="#" target="_blank" rel="noopener"></a></li>
            <li data-empresa="direccion"></li>
          </ul>
        </div>
      </div>

      <div class="footer__abajo">
        <span>&copy; <span data-anio></span> Braccis. Todos los derechos reservados.</span>
        <span>Primavera–Verano 2027</span>
      </div>
    </div>
  </footer>

  <a class="wsp-flotante" data-wsp href="#" aria-label="Escribinos por WhatsApp">

  <div class="modal" data-modal>
    <div class="modal__caja" data-modal-contenido></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
